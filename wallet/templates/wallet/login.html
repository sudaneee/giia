{% extends 'wallet/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row">
  <div class="col-12 col-sm-8 offset-sm-2 col-md-6 offset-md-3 col-lg-6 offset-lg-3 col-xl-4 offset-xl-4">
    <div class="card">
      <div class="card-header">
        <h4 class="text-center">Parent Portal Login</h4>
      </div>
      <div class="card-body">
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST" novalidate>
          {% csrf_token %}
          <div class="form-group">
            <label for="identifier">Email or Username</label>
            <input id="identifier" type="text" class="form-control" name="identifier" required autofocus>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" class="form-control" name="password" required>
          </div>
          <div class="form-group">
            <button type="submit" class="btn btn-primary btn-lg btn-block">Login</button>
          </div>
        </form>
        <p class="text-center mt-3">Don't have an account? <a href="{% url 'wallet:register' %}">Register here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
